name: plugin-release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: echo "V=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: pnpm pack
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.V }}
          draft: false
          files: '*.tgz'
